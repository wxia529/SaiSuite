name: Android and Windows packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-packages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag and source
    if: github.repository == 'wxia529/SaiSuite' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py version

  build:
    name: Build and verify four signed APKs
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source version and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/release.py version
      - uses: ./.github/actions/setup
      - name: Restore existing release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/release.py prepare-signing
      - name: Build Universal and preserve it before split build
        run: |
          flutter build apk --release
          python3 tools/release.py collect --universal
      - name: Build ARM64, ARM32 and x86_64
        run: |
          flutter build apk --release --split-per-abi
          python3 tools/release.py collect --split
      - name: Verify certificate, versions, ABI and checksums
        run: python3 tools/release.py verify
      - name: Remove temporary signing files
        if: always()
        run: python3 tools/release.py clean-signing
      - name: Upload the verified distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SaiSuite-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows:
    name: Build Windows x64 installer and portable package
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Build Windows installer and complete portable package
        shell: pwsh
        run: ./tools/build_windows.ps1 -OutputDirectory dist/windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SaiSuite-windows-${{ github.ref_name }}
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
            dist/windows/*-setup.exe
            dist/windows/*-setup.exe.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish complete GitHub Release
    needs: [build, windows]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SaiSuite-${{ needs.build.outputs.tag }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SaiSuite-windows-${{ github.ref_name }}
          path: dist
      - name: Upload Android and Windows assets to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_WINDOWS: 'true'
        run: python3 tools/release.py publish
