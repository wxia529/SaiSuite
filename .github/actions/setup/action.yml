name: SaiSuite Android toolchain
description: Pinned Flutter and Android build dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/**/*.gradle.kts
          android/gradle/wrapper/gradle-wrapper.properties
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.6'
        channel: stable
        cache: true
    - name: Configure Android SDK and runner memory
      shell: bash
      run: |
        flutter --disable-analytics
        flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
        sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
        mkdir -p "$HOME/.gradle"
        printf '%s\n' 'org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m' >> "$HOME/.gradle/gradle.properties"
        flutter pub get
